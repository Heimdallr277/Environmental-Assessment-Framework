# =============================================================================
# Parameter registry — vve-heat-abm-lca
# Every model input lives here. Fields:
#   value  : central (baseline) value used in deterministic runs
#   unit   : unit of `value`
#   dist   : sampling distribution for uncertainty analysis (omit = fixed)
#            uniform{low,high} | triangular{low,mode,high} | loguniform{low,high}
#   type   : provenance label
#            documented  = value taken directly from a cited source
#            derived     = calculated from documented values (calculation in `note`)
#            proxy       = documented value for a related product/region used as stand-in
#            assumption  = modeler's judgment (literature-informed where possible)
#            scenario    = exploratory scenario input, not a forecast
#            calibrated  = fitted inside the model to a documented/derived target
#   source : key into the `sources` table at the bottom
#   group  : behavior | institutional | housing | technical | background | cost | method
#   gsa    : true if the parameter is a factor in the Sobol analysis
# Retrieval date for all web sources: 2026-10-03.
# =============================================================================

# ---------------------------------------------------------------- characterization
gwp100_ar6:
  CO2_fossil:    {value: 1.0,    unit: kg CO2e/kg, type: documented, source: ipcc_ar6_gwp, group: method}
  CH4_fossil:    {value: 29.8,   unit: kg CO2e/kg, type: documented, source: ipcc_ar6_gwp, group: method}
  CH4_nonfossil: {value: 27.0,   unit: kg CO2e/kg, type: documented, source: ipcc_ar6_gwp, group: method}
  N2O:           {value: 273.0,  unit: kg CO2e/kg, type: documented, source: ipcc_ar6_gwp, group: method}
  HFC32:         {value: 771.0,  unit: kg CO2e/kg, type: documented, source: ipcc_ar6_gwp, group: method}
  R290:          {value: 0.02,   unit: kg CO2e/kg, type: documented, source: swegon_epd_r290, group: method,
                  note: "GWP of propane as stated in manufacturer EPDs; negligible either way"}
  CO2e_embodied: {value: 1.0,    unit: kg CO2e/kg CO2e, type: assumption, source: none, group: method,
                  note: "Aggregated cradle-to-gate EPD/LCA results are carried as CO2-equivalent and characterized like CO2 in the dynamic metric"}

# ---------------------------------------------------------------- electricity background
electricity:
