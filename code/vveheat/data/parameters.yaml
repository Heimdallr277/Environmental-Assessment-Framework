    leak_annual: {value: 0.03, unit: '-/yr', dist: {type: uniform, low: 0.02, high: 0.05}, type: documented,
                  source: refrigerant_leak_lit, group: technical, gsa: false,
                  note: "2%/yr (Vaillant EPD) to 5%/yr (Vering et al.)"}
    leak_eol: {value: 0.20, unit: '-', dist: {type: uniform, low: 0.10, high: 0.30}, type: assumption,
               source: refrigerant_leak_lit, group: technical, gsa: false, note: "Vering et al. assume 30%"}
    r32_share_2026: {value: 0.5, unit: '-', type: assumption, source: fgas_2024, group: technical,
                     note: "from 2027 F-gases with GWP>=150 banned in new monoblock (<=50 kW) and small split air-water units"}
    r32_share_post2026: {value: 0.0, unit: '-', type: scenario, source: fgas_2024, group: technical,
                         note: "0 under Reg. (EU) 2024/573; set to 0.6 in the 'no F-gas ban' counterfactual"}

# ---------------------------------------------------------------- prices (real, constant; Jan 2026, incl. VAT)
prices:
  gas_per_m3: {value: 1.3136, unit: EUR/m3, type: derived, source: cbs_85592, group: cost,
               note: "variable supply 0.5868 + energy tax 0.7268"}
  elec_per_kwh: {value: 0.2606, unit: EUR/kWh, type: derived, source: cbs_85592, group: cost,
                 note: "variable supply 0.1497 + energy tax 0.11085"}
  gas_fixed_per_yr: {value: 360.69, unit: EUR/yr, type: derived, source: cbs_85592, group: cost,
                     note: "transport 268.37 + fixed supply 92.32; avoided when the gas connection is removed"}
  dh_cost_ratio: {value: 1.0, unit: '-', type: assumption, source: none, group: cost,
                  note: "annual DH bill relative to the gas reference ('not more than otherwise' principle)"}
  subsidy_share_hp: {value: 0.30, unit: '-', type: assumption, source: isde_eval, group: cost,
                     note: "ISDE subsidy intensity for heat pumps (order of magnitude from ISDE evaluation scenarios)"}

# ---------------------------------------------------------------- behavior (individual choice)
behavior:
  beta_cost: {value: -0.60, unit: 'utility per EUR 100/yr', dist: {type: uniform, low: -1.0, high: -0.3},
              type: assumption, source: none, group: behavior, gsa: true}
  beta_env: {value: 0.50, unit: 'utility per t CO2e/yr avoided (env=1)', dist: {type: uniform, low: 0.0, high: 1.2},
             type: assumption, source: none, group: behavior, gsa: true}
  beta_soc: {value: 2.0, unit: 'utility per unit adopter share', dist: {type: uniform, low: 0.0, high: 4.0},
             type: assumption, source: arvanitopoulos_2025, group: behavior, gsa: true,
             note: "empirical spatial spillovers in heat-pump uptake motivate a positive term; magnitude is assumed"}
  beta_rel: {value: 2.0, unit: 'utility per unit perceived reliability', type: assumption, source: none, group: behavior}
  discount_rate_median: {value: 0.12, unit: '1/yr', dist: {type: uniform, low: 0.06, high: 0.25}, type: assumption,
                         source: schleich_2016, group: behavior, gsa: true,
                         note: "implicit discount rates for household efficiency investments are typically high"}
  horizon_years: {value: 12, unit: yr, type: assumption, source: none, group: behavior}
  prior_rel_mean: {value: 0.60, unit: '-', type: assumption, source: none, group: behavior}
  prior_rel_strength: {value: 4.0, unit: pseudo-observations, type: assumption, source: none, group: behavior}
  true_rel: {value: 0.85, unit: '-', type: assumption, source: none, group: behavior}
  env_mean: {value: 0.5, unit: '-', type: assumption, source: none, group: behavior}
  env_beta_a: {value: 2.0, unit: '-', type: assumption, source: none, group: behavior,
               note: "environmental attitude ~ Beta(a, b), mean a/(a+b)"}
  env_beta_b: {value: 2.0, unit: '-', type: assumption, source: none, group: behavior}
  discount_sigma: {value: 0.4, unit: log-sd, type: assumption, source: none, group: behavior}
  soc_own_weight: {value: 0.5, unit: '-', type: assumption, source: none, group: behavior,
                   note: "weight of own building vs network-neighbor buildings in the descriptive social norm"}
  obs_neighbor_rate: {value: 0.2, unit: observations per neighbor-building HP, type: assumption, source: none, group: behavior}
  obs_cap: {value: 10, unit: observations/yr, type: assumption, source: none, group: behavior}
  network_k: {value: 4, unit: neighbors, type: assumption, source: none, group: behavior,
              note: "Watts-Strogatz building network: mean degree"}
  network_p: {value: 0.1, unit: '-', type: assumption, source: none, group: behavior}
  calib_gas_m3: {value: 770, unit: m3/yr, type: documented, source: cbs_81528, group: behavior,
                 note: "calibration reference household: terraced house, average gas use 2024 (provisional)"}
  calib_social_share: {value: 0.099, unit: '-', type: derived, source: kev_2026_hp_stock, group: behavior,
                       note: "829,000 heat pumps (end 2025) / 8,344,953 dwellings (1 Jan 2026)"}
  target_share_hybrid_2025: {value: 0.10, unit: '-', dist: {type: uniform, low: 0.07, high: 0.13}, type: derived,
                             source: dne_trendrapport_2026, group: behavior, gsa: false,
                             note: "43,000 hybrid sales in 2025 / ~430,000 heating replacements per year"}
  target_share_allelectric_2025: {value: 0.07, unit: '-', dist: {type: uniform, low: 0.04, high: 0.10}, type: derived,
                                  source: dne_trendrapport_2026, group: behavior, gsa: false,
                                  note: "86,000 residential all-electric sales in 2025, assumed ~35% to existing homes, / ~430,000 replacements"}

# ---------------------------------------------------------------- institutional (VvE decision-making)
institutional:
  deed_num: {value: 2, unit: '-', type: assumption, source: vve_versnellingsagenda, group: institutional,
             note: "baseline deed rule (numerator): a collective proposal passes if deed_den x yes >= deed_num x votes cast (exact integer comparison). Older regulations often require 2/3 or 3/4; the true distribution of deed rules is unknown, so a common 2/3 rule is assumed for BOTH collective heat pumps and DH offers"}
  deed_den: {value: 3, unit: '-', type: assumption, source: vve_versnellingsagenda, group: institutional}
  quorum: {value: 0.5, unit: '-', type: assumption, source: vve_versnellingsagenda, group: institutional,
           note: "quorum is retained in the reform proposal; its level depends on the regulations"}
  turnout: {value: 0.60, unit: '-', dist: {type: uniform, low: 0.4, high: 0.8}, type: assumption, source: none,
            group: institutional, gsa: true}
  agenda_base: {value: 0.08, unit: 1/yr, dist: {type: uniform, low: 0.03, high: 0.20}, type: assumption, source: none,
                group: institutional, gsa: true}
  agenda_mjop_boost: {value: 0.40, unit: '-', type: assumption, source: none, group: institutional,
                      note: "added agenda probability in a major-maintenance (MJOP) year"}
  agenda_dh_offer_boost: {value: 0.50, unit: '-', type: assumption, source: none, group: institutional}
  small_vve_size: {value: 8, unit: apartments, type: documented, source: bzk_vve_study, group: institutional,
                   note: "small VvEs are less well organized and decide less easily"}
  small_vve_factor: {value: 0.5, unit: '-', type: assumption, source: bzk_vve_study, group: institutional}
  inertia: {value: 0.5, unit: utility, dist: {type: uniform, low: 0.0, high: 1.5}, type: assumption, source: none,
            group: institutional, gsa: true}
  sunk_cost_weight: {value: 1.0, unit: '-', dist: {type: uniform, low: 0.0, high: 1.5}, type: assumption, source: none,
                     group: institutional, gsa: true}
  landlord_yes_prob: {value: 0.30, unit: '-', dist: {type: uniform, low: 0.1, high: 0.6}, type: assumption, source: none,
                      group: institutional, gsa: true}
  corporation_budget: {value: 14000, unit: EUR/apartment, type: assumption, source: none, group: institutional}
  agenda_interest_boost: {value: 0.3, unit: '-', type: assumption, source: none, group: institutional,
                          note: "agenda probability added per unit heat-pump share in the building (bottom-up initiative)"}
  impl_lag_min: {value: 1, unit: yr, type: assumption, source: none, group: institutional}
  impl_lag_max: {value: 3, unit: yr, type: assumption, source: none, group: institutional}
  cooldown: {value: 3, unit: yr, type: assumption, source: none, group: institutional}
  mjop_interval: {value: 10, unit: yr, type: assumption, source: none, group: institutional}

# ---------------------------------------------------------------- policy & scenario settings
policy:
  dh_arrival_year: {value: 2035, unit: year, type: scenario, source: none, group: institutional}
  hybrid_standard_year: {value: 2029, unit: year, type: documented, source: coalition_2026, group: institutional}
  majority_reform_year: {value: 2028, unit: year, type: assumption, source: vve_versnellingsagenda, group: institutional,
                         note: "S2: strict simple majority (2 x yes > votes cast) for all collective sustainability decisions; planned reform, entry year assumed"}
  dh_majority_year: {value: 2027, unit: year, type: scenario, source: wcw_vve, group: institutional,
                     note: "S2d HYPOTHETICAL: strict simple majority for DH offers only, overriding deed rules. The Collective Heat Act sets an absolute-majority default for accepting a designated heat company's offer but lets VvE regulations prescribe a higher threshold, which normally applies; the v1 baseline wrongly treated the default as binding"}
  dh_cancel_year: {value: 2032, unit: year, type: scenario, source: none, group: institutional,
                   note: "S4c: heat network announced for 2035 and canceled in this year"}
  collective_subsidy_extra: {value: 0.20, unit: '-', type: scenario, source: none, group: cost,
                             note: "S3: extra subsidy share on collective heat-pump and DH connection capex"}
  bridging_window: {value: 5, unit: yr, type: scenario, source: none, group: institutional,
                    note: "S5: owners repair instead of replacing a failed boiler when a collective decision is planned within this window"}

