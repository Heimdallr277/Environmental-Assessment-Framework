    gas:     {value: 490, unit: g CO2e/kWh, type: documented, source: ipcc_ar5_annex3, group: background}
    coal:    {value: 820, unit: g CO2e/kWh, type: documented, source: ipcc_ar5_annex3, group: background}
    biomass: {value: 230, unit: g CO2e/kWh, type: documented, source: ipcc_ar5_annex3, group: background}
    wind:    {value: 11.5, unit: g CO2e/kWh, type: derived, source: ipcc_ar5_annex3, group: background,
              note: "mean of onshore (11) and offshore (12) medians"}
    solar:   {value: 44.5, unit: g CO2e/kWh, type: derived, source: ipcc_ar5_annex3, group: background,
              note: "mean of utility (48) and rooftop (41) medians"}
    nuclear: {value: 12,  unit: g CO2e/kWh, type: documented, source: ipcc_ar5_annex3, group: background}
    hydro:   {value: 24,  unit: g CO2e/kWh, type: documented, source: ipcc_ar5_annex3, group: background}
    other_fossil: {value: 700, unit: g CO2e/kWh, type: assumption, source: none, group: background,
              note: "oil/other fossil; small share (3.9% in 2025)"}
  mix_2025:   # shares of generation, OWID/Ember 2025
    gas: {value: 0.3489, unit: '-', type: documented, source: owid_ember, group: background}
    coal: {value: 0.0708, unit: '-', type: documented, source: owid_ember, group: background}
    other_fossil: {value: 0.0388, unit: '-', type: documented, source: owid_ember, group: background}
    wind: {value: 0.2497, unit: '-', type: documented, source: owid_ember, group: background}
    solar: {value: 0.2112, unit: '-', type: documented, source: owid_ember, group: background}
    nuclear: {value: 0.0296, unit: '-', type: documented, source: owid_ember, group: background}
    biomass: {value: 0.0508, unit: '-', type: documented, source: owid_ember, group: background}
    hydro: {value: 0.0004, unit: '-', type: documented, source: owid_ember, group: background}
  grid_loss_factor: {value: 1.06, unit: '-', dist: {type: uniform, low: 1.04, high: 1.08},
                     type: assumption, source: none, group: background, gsa: false,
                     note: "transmission+distribution losses to low-voltage consumers"}
  winter_weight_SH: {value: 1.15, unit: '-', dist: {type: uniform, low: 1.0, high: 1.35},
                     type: assumption, source: seasonal_ef_lit, group: background, gsa: true,
                     note: "ratio of heating-season-weighted to annual-average grid intensity, applied to heat-pump space-heating electricity; literature shows seasonal variation materially changes results"}
  pathway_mix:   # SCENARIO shares of generation (not forecasts). Coal banned from 2030 (Wet verbod op kolen).
    # columns: gas, coal, other_fossil, wind, solar, nuclear, biomass, hydro
    slow:
      2030: [0.35, 0.00, 0.03, 0.31, 0.24, 0.03, 0.04, 0.00]
      2035: [0.28, 0.00, 0.02, 0.36, 0.27, 0.03, 0.04, 0.00]
      2040: [0.22, 0.00, 0.01, 0.40, 0.28, 0.05, 0.04, 0.00]
      2050: [0.12, 0.00, 0.00, 0.47, 0.30, 0.08, 0.03, 0.00]
    moderate:   # anchored on KEV 2025: ~60% renewable electricity in 2030
      2030: [0.30, 0.00, 0.02, 0.33, 0.27, 0.03, 0.05, 0.00]
      2035: [0.18, 0.00, 0.01, 0.42, 0.30, 0.04, 0.05, 0.00]
      2040: [0.10, 0.00, 0.00, 0.48, 0.31, 0.07, 0.04, 0.00]
      2050: [0.03, 0.00, 0.00, 0.52, 0.32, 0.10, 0.03, 0.00]
    fast:       # former 'CO2-free electricity by 2035' ambition
      2030: [0.24, 0.00, 0.01, 0.37, 0.30, 0.03, 0.05, 0.00]
      2035: [0.04, 0.00, 0.00, 0.50, 0.33, 0.07, 0.06, 0.00]
      2040: [0.02, 0.00, 0.00, 0.52, 0.33, 0.09, 0.04, 0.00]
      2050: [0.01, 0.00, 0.00, 0.53, 0.33, 0.10, 0.03, 0.00]
  pathway_index: {value: 0.5, unit: '-', dist: {type: uniform, low: 0.0, high: 1.0}, type: scenario,
                  source: none, group: background, gsa: true,
                  note: "continuous GSA factor: 0 = slow, 0.5 = moderate, 1 = fast (piecewise-linear interpolation)"}

